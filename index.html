<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ABCJS 簡譜 Playground</title>
    <script src="dist/abcjs-basic.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #222;
        background: #f5f5f5;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .toolbar .hint {
        color: #555;
        font-size: 13px;
      }
      .toolbar .play-controls {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
      .toolbar .play-option {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: white;
        white-space: nowrap;
      }
      .toolbar .play-option input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
      }
      .toolbar .play-option input[type="number"] {
        width: 70px;
        min-height: 34px;
        padding: 6px 8px;
        border: 1px solid #aaa;
        border-radius: 4px;
        font: inherit;
      }
      select,
      button {
        padding: 7px 10px;
        min-height: 40px;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(300px, 0.8fr) minmax(420px, 1.2fr);
        gap: 14px;
        min-height: calc(100vh - 90px);
      }
      .panel {
        min-width: 0;
        padding: 12px;
        border: 1px solid #ccc;
        background: white;
      }
      .panel h2 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .panel-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        font-weight: bold;
        font-size: 15px;
        color: inherit;
        cursor: pointer;
        min-height: auto;
      }
      .panel-toggle .chevron {
        transition: transform 0.15s ease;
      }
      .panel-toggle[aria-expanded="false"] .chevron {
        transform: rotate(-90deg);
      }
      .panel-body.collapsed {
        display: none;
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 200px;
        padding: 10px;
        border: 1px solid #aaa;
        resize: none;
        overflow: hidden;
        font:
          14px/1.5 Consolas,
          "Courier New",
          monospace;
        tab-size: 2;
      }
      #preview {
        min-height: 240px;
        padding-left: 20px;
        overflow: auto;
        border: 1px solid #ddd;
        background: white;
      }
      #preview svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      #messages {
        margin: 10px 0 0;
        padding: 10px;
        white-space: pre-wrap;
        font:
          13px/1.45 Consolas,
          "Courier New",
          monospace;
        color: #7a5200;
        background: #fff8dc;
        border: 1px solid #e3ce87;
      }
      #messages.ok {
        color: #35653b;
        background: #effaf0;
        border-color: #b9d8bc;
      }
      #messages.error {
        color: #8b1e1e;
        background: #fff0f0;
        border-color: #e0aaaa;
      }
      @media (max-width: 850px) {
        .workspace {
          grid-template-columns: 1fr;
        }
        textarea {
          min-height: 260px;
        }
      }
      @media (max-width: 600px) {
        html,
        body {
          overflow-x: hidden;
        }
        body {
          padding: 10px;
        }
        h1 {
          font-size: 17px;
        }
        .toolbar {
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
        }
        .toolbar > .mode-label {
          display: none;
        }
        .toolbar .play-controls {
          margin-left: 0;
          flex-wrap: nowrap;
          overflow-x: auto;
        }
        .toolbar .play-option {
          flex: 1 0 auto;
        }
        #mode,
        #play,
        #print {
          width: 100%;
        }
        .panel {
          padding: 10px;
        }
        textarea {
          min-height: 160px;
          font-size: 13px;
          white-space: pre-wrap;
          word-break: break-word;
          overflow-wrap: anywhere;
        }
        #preview {
          padding-left: 8px;
        }
      }
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
      @media print {
        body {
          padding: 0;
          background: white;
        }
        h1,
        .toolbar,
        .input-panel,
        #messages {
          display: none !important;
        }
        .workspace,
        .output-panel {
          display: block;
          min-height: 0;
          padding: 0;
          border: 0;
        }
        .output-panel h2 {
          display: none;
        }
        .panel-body.collapsed {
          display: block;
        }
        #preview {
          overflow: visible;
          min-height: 0;
          padding-left: 0;
          border: 0;
        }
        #preview svg {
          display: block;
          width: 100%;
          height: auto;
        }
        #preview .jianpu-number {
          font-size: 25px !important;
        }
        #preview .jianpu-accidental {
          font-size: 17.5px !important;
        }
        #preview .jianpu-chord {
          font-size: 20.5px !important;
        }
        #preview .jianpu-measure-number {
          font-size: 23px !important;
        }
        #preview .jianpu-dynamic {
          font-size: 15px !important;
        }
        #preview .jianpu-fingering-text {
          font-size: 16px !important;
        }
        #preview .jianpu-title {
          font-size: 39px !important;
        }
        #preview .jianpu-composer {
          font-size: 16px !important;
        }
        #preview .jianpu-header {
          font-size: 18px !important;
        }
        #preview .jianpu-meter {
          font-size: 14px !important;
        }
      }
    </style>
  </head>
  <body>
    <h1>ABCJS 簡譜 Playground</h1>
    <div class="toolbar">
      <label class="mode-label" for="mode">輸入模式</label>
      <select id="mode">
        <option value="abc">ABC 模式</option>
        <option value="text">簡譜文字模式</option>
      </select>
      <div class="play-controls">
        <label class="play-option" for="repeat-playback">
          <input id="repeat-playback" type="checkbox" />
          <span>重複播放</span>
        </label>
        <label class="play-option" for="playback-speed">
          <span>速度</span>
          <input id="playback-speed" type="number" min="10" max="500" step="1" value="100" />
          <span>%</span>
        </label>
      </div>
      <button id="play" type="button">播放</button>
      <button id="print" type="button">列印／儲存 PDF</button>
      <span class="hint">ABC 指法範例：<code>"^1"A</code></span>
    </div>

    <main class="workspace">
      <section class="panel input-panel">
        <h2>
          <button
            type="button"
            class="panel-toggle"
            data-target="input-body"
            aria-expanded="true"
          >
            輸入 <span class="chevron" aria-hidden="true">▾</span>
          </button>
        </h2>
        <div class="panel-body" id="input-body">
          <textarea
            id="input"
            spellcheck="false"
            aria-label="樂譜輸入"
          ></textarea>
        </div>
      </section>
      <section class="panel output-panel">
        <h2>
          <button
            type="button"
            class="panel-toggle"
            data-target="output-body"
            aria-expanded="true"
          >
            簡譜 SVG <span class="chevron" aria-hidden="true">▾</span>
          </button>
        </h2>
        <div class="panel-body" id="output-body">
          <div id="preview"></div>
          <pre id="messages" class="ok">沒有 warnings</pre>
        </div>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        var examples = {
          abc: [
            "X:1",
            "T:思愁",
            "C:ZeppelinTsai",
            "M:4/4",
            "L:1/8",
            "K:Amin",
            "Q:180",
            'V:1 clef=treble name="Melody"',
            "[V:1]",
            '"Am""^4"A6"^1"D2|"F"A4G2A2|"Dm""^5"c4B4|"Em""^2"G8|',
            '"F""^1"F4"^2"E2"^3"F2|"Em"G4E4|"G"D8-|D8|',
            '"Am""^4"A6"^1"D2|"F"A4G2A2|"Dm""^5"c4B4|"Em""^2"G8|',
            '"F""^1"F4"^2"E2"^3"F2|"C"G4C4|"G"D8-|D8|',
            '"F""^5"d4c4|"G"B4G4|"Am"ABA6|',
            '"C""^1"c2d2e4|"F"g4c4|"E7"d8-|d8|',
            '"Am""^5"C4B,4|"F"A,4G,4|"Dm"F,G,A,6|',
            '"C""^1"C2D2E4|"Em"G6CE|"G"D8-|D8|',
            '"Am""^2"A2B2c4|"F"B4G4|"Am"A2B2c4|"G"d4B4|',
            '"Am""^2"A2B2c4|"Em"B4G4|"Am"A8-|A8||',
          ].join("\n"),
          text: [
            "T:Octave and Duration Example",
            "M:4/4",
            "K:C",
            "1, 2,, 3 4' | 5'' 6_ 7_ 1- | 2. 3__ 4__ 5- |",
            "6.. 7__ 1- | 2--- | 0 0 0 0 |]",
          ].join("\n"),
        };
        var drafts = {
          abc: examples.abc,
          text: examples.text,
        };
        var mode = document.getElementById("mode");
        var input = document.getElementById("input");
        var preview = document.getElementById("preview");
        var messages = document.getElementById("messages");
        var playButton = document.getElementById("play");
        var printButton = document.getElementById("print");
        var repeatPlaybackCheckbox = document.getElementById("repeat-playback");
        var playbackSpeedInput = document.getElementById("playback-speed");
        var debounceTimer;
        var playgroundTitle = document.title;
        var printTitle = playgroundTitle;
        var lastLayout = null;
        var DEFAULT_PLAYBACK_BPM = 180;
        var playTimeouts = [];

        function updatePrintTitle(header) {
          var parts = [];
          if (header && header.title) parts.push(header.title.trim());
          if (header && header.composer) parts.push(header.composer.trim());
          printTitle = parts.filter(Boolean).join(" - ") || playgroundTitle;
        }

        function showMessages(warnings) {
          if (!warnings.length) {
            messages.className = "ok";
            messages.textContent = "沒有 warnings";
            return;
          }
          messages.className = "";
          messages.textContent = warnings
            .map(function (warning, index) {
              return index + 1 + ". " + warning;
            })
            .join("\n");
        }

        function render() {
          try {
            var options = { staffWidth: 800 };
            var result =
              mode.value === "abc"
                ? ABCJS.jianpu.fromAbc(input.value, options, ABCJS.parseOnly)
                : ABCJS.jianpu.fromText(input.value, options);
            preview.innerHTML = result.svg;
            updatePrintTitle(result.layout && result.layout.header);
            showMessages(result.warnings);
            lastLayout = result.layout;
          } catch (error) {
            preview.innerHTML = "";
            printTitle = playgroundTitle;
            messages.className = "error";
            messages.textContent = error.name + ": " + error.message;
          }
        }

        function stopPlayback() {
          playTimeouts.forEach(clearTimeout);
          playTimeouts = [];
          playButton.textContent = "播放";
        }

        function getSecondsPerBeat() {
          var speedPercent = Number(playbackSpeedInput.value);
          if (!isFinite(speedPercent) || speedPercent <= 0) speedPercent = 100;
          return 60 / (DEFAULT_PLAYBACK_BPM * (speedPercent / 100));
        }

        function collectPlayableEvents(layout) {
          var events = [];
          layout.lines.forEach(function (line) {
            line.measures.forEach(function (measure) {
              measure.events.forEach(function (event) {
                events.push(event);
              });
            });
          });
          return events;
        }

        // A tie means "hold the note", not "play it again": fold each tied
        // continuation note into the sustain of the note that started the
        // tie instead of scheduling a second attack for it.
        function buildPlaybackSchedule(layout) {
          var schedule = [];
          var pendingTies = new Map();
          var offsetBeats = 0;
          collectPlayableEvents(layout).forEach(function (event) {
            var durationBeats = event.durationBeats || 1;
            event.notePositions.forEach(function (note) {
              if (typeof note.midi !== "number" || !isFinite(note.midi))
                return;
              var signature = note.number + ":" + note.octaveDots;
              var pendingEntry = note.tieEnd
                ? pendingTies.get(signature)
                : null;
              if (pendingEntry) {
                pendingEntry.durationBeats += durationBeats;
                if (!note.tieStart) pendingTies.delete(signature);
                return;
              }
              var entry = {
                midi: note.midi,
                offsetBeats: offsetBeats,
                durationBeats: durationBeats,
              };
              schedule.push(entry);
              if (note.tieStart) pendingTies.set(signature, entry);
            });
            offsetBeats += durationBeats;
          });
          return schedule;
        }

        function playTune() {
          if (!lastLayout) return;
          stopPlayback();
          var secondsPerBeat = getSecondsPerBeat();
          var schedule = buildPlaybackSchedule(lastLayout);
          var totalMs = 0;
          function queuePlaybackCycle() {
            schedule.forEach(function (item) {
              var offsetMs = item.offsetBeats * secondsPerBeat * 1000;
              var durationSeconds = item.durationBeats * secondsPerBeat;
              totalMs = Math.max(totalMs, offsetMs + durationSeconds * 1000);
              playTimeouts.push(
                setTimeout(function () {
                  ABCJS.jianpu.pianoPlayer.playNote(item.midi, durationSeconds);
                }, offsetMs),
              );
            });
            playTimeouts.push(
              setTimeout(function () {
                if (repeatPlaybackCheckbox.checked) {
                  queuePlaybackCycle();
                } else {
                  stopPlayback();
                }
              }, totalMs),
            );
          }
          queuePlaybackCycle();
          playButton.textContent = "停止";
        }

        function scheduleRender() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(render, 220);
        }

        function autoResizeTextarea() {
          input.style.height = "auto";
          input.style.height = input.scrollHeight + "px";
        }

        document.querySelectorAll(".panel-toggle").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var body = document.getElementById(btn.getAttribute("data-target"));
            var collapsed = body.classList.toggle("collapsed");
            btn.setAttribute("aria-expanded", String(!collapsed));
          });
        });

        mode.addEventListener("change", function () {
          var previousMode = mode.value === "abc" ? "text" : "abc";
          drafts[previousMode] = input.value;
          input.value = drafts[mode.value];
          autoResizeTextarea();
          render();
        });
        input.addEventListener("input", function () {
          drafts[mode.value] = input.value;
          autoResizeTextarea();
          scheduleRender();
        });
        window.addEventListener("resize", autoResizeTextarea);
        preview.addEventListener("click", function (event) {
          var noteEl = event.target.closest(".jianpu-note");
          if (!noteEl) return;
          var midi = Number(noteEl.getAttribute("data-midi"));
          if (!isFinite(midi)) return;
          var eventEl = noteEl.closest(".jianpu-event");
          var beats = eventEl
            ? Number(eventEl.getAttribute("data-duration-beats"))
            : 1;
          ABCJS.jianpu.pianoPlayer.playNote(
            midi,
            (isFinite(beats) ? beats : 1) * getSecondsPerBeat(),
          );
        });
        playButton.addEventListener("click", function () {
          if (playButton.textContent === "停止") stopPlayback();
          else playTune();
        });
        printButton.addEventListener("click", function () {
          render();
          window.print();
        });
        window.addEventListener("beforeprint", function () {
          document.title = printTitle;
        });
        window.addEventListener("afterprint", function () {
          document.title = playgroundTitle;
        });

        ABCJS.jianpu.pianoPlayer.loadSamples("src/jianpu/piano-samples/");

        input.value = drafts.abc;
        autoResizeTextarea();
        render();
      })();
    </script>
  </body>
</html>
